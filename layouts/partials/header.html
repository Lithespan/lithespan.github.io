<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="/" aria-label="Lithespan home">
      <span class="brand-mark" aria-hidden="true"><span class="mark-pier"></span><span class="mark-span"></span><span class="mark-target"></span></span>
      <span>Lithespan</span>
    </a>

    <nav class="desktop-nav" aria-label="Primary navigation">
      <a href="/products/"{{ if eq .RelPermalink "/products/" }} aria-current="page"{{ end }}>What we build</a>
      <a href="/how-it-works/"{{ if eq .RelPermalink "/how-it-works/" }} aria-current="page"{{ end }}>How it works</a>
      <a href="/services/"{{ if eq .RelPermalink "/services/" }} aria-current="page"{{ end }}>Services</a>
    </nav>

    <div class="header-tools">
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Use light theme" title="Change color theme">
        <span class="theme-toggle-icon" aria-hidden="true"></span>
      </button>
      <a class="nav-contact" href="mailto:{{ site.Params.email }}">Contact</a>
      <details class="mobile-menu">
        <summary>Menu</summary>
        <nav aria-label="Mobile navigation">
          <a href="/products/"{{ if eq .RelPermalink "/products/" }} aria-current="page"{{ end }}>What we build</a>
          <a href="/how-it-works/"{{ if eq .RelPermalink "/how-it-works/" }} aria-current="page"{{ end }}>How it works</a>
          <a href="/services/"{{ if eq .RelPermalink "/services/" }} aria-current="page"{{ end }}>Services</a>
          <a href="mailto:{{ site.Params.email }}">Contact</a>
        </nav>
      </details>
    </div>
  </div>
</header>
